<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FieldWorks — Coming Soon</title>
<meta name="description" content="Composable, open, MCP-native. Protocol-first, multi-agent, runs on-prem for air-gapped facilities.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #363432;
    --bg-card: #403e3c;
    --bg-muted: #484644;
    --text: #f0ede8;
    --text-secondary: #a09d98;
    --text-tertiary: #6b6860;
    --border: rgba(240,237,232,0.1);
    --border-strong: rgba(240,237,232,0.2);
    --teal: #00a0b0;
    --purple: #c060be;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
  }

  html, body {
    height: 100%;
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
  }

  .container {
    max-width: 480px;
    width: 100%;
    text-align: center;
  }

  .wordmark {
    font-family: var(--mono);
    font-size: clamp(36px, 8vw, 56px);
    font-weight: 500;
    letter-spacing: -0.03em;
    color: var(--purple);
    margin-bottom: 0.5rem;
    line-height: 1;
  }

  .rule {
    width: 100%;
    height: 2px;
    background: var(--teal);
    margin: 1.25rem 0;
  }

  .tagline {
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 300;
    color: var(--text-secondary);
    line-height: 1.65;
    margin-bottom: 2.5rem;
  }

  .form-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--text-tertiary);
    text-transform: uppercase;
    display: block;
    text-align: left;
    margin-bottom: 1rem;
  }

  .fields {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 12px;
  }

  input {
    font-family: var(--sans);
    font-size: 14px;
    width: 100%;
    padding: 10px 14px;
    background: var(--bg-card);
    border: 1px solid var(--border-strong);
    border-radius: 3px;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }

  input::placeholder {
    color: var(--text-tertiary);
  }

  input:focus {
    border-color: var(--teal);
  }

  button {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    width: 100%;
    padding: 10px 18px;
    background: var(--teal);
    color: #ffffff;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: opacity 0.15s;
  }

  button:hover { opacity: 0.85; }

  .note {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-tertiary);
    margin-top: 10px;
  }

  .footer {
    margin-top: 3rem;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--teal);
  }

  /* Success state */
  .success {
    display: none;
    padding: 14px;
    background: var(--bg-card);
    border: 1px solid var(--teal);
    border-radius: 3px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--teal);
    margin-top: 12px;
  }
</style>
</head>
<body>

<div class="container">
  <div class="wordmark">FieldWorks</div>
  <div class="rule"></div>
  <p class="tagline">Composable, open, MCP-native. Protocol-first, multi-agent, designed to run fully on-premises in air-gapped environments.</p>

  <span class="form-label">Notify me when it launches</span>
  <form id="signup" action="https://formspree.io/f/mbderqya" method="POST" onsubmit="handleSubmit(event)">
    <div class="fields">
      <input type="text" name="name" placeholder="Name" required autocomplete="name">
      <input type="email" name="email" placeholder="Email" required autocomplete="email">
    </div>
    <button type="submit">Notify me</button>
  </form>
  <p class="note">No spam. One email when FieldWorks launches.</p>
  <div class="success" id="success">Thanks — you'll hear from us at launch.</div>

  <div class="footer">fieldworks.build</div>
</div>

<script>
  async function handleSubmit(e) {
    e.preventDefault();
    const form = document.getElementById('signup');
    const data = new FormData(form);

    try {
      const response = await fetch(form.action, {
        method: 'POST',
        body: data,
        headers: { 'Accept': 'application/json' }
      });

      if (response.ok) {
        form.style.display = 'none';
        document.querySelector('.form-label').style.display = 'none';
        document.querySelector('.note').style.display = 'none';
        document.getElementById('success').style.display = 'block';
      } else {
        alert('Something went wrong. Please try again.');
      }
    } catch (err) {
      alert('Something went wrong. Please try again.');
    }
  }
</script>

</body>
</html>
